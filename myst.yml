version: 1
project:
  title: "Exploring Optics: From Fundamentals to Advanced Applications"
  description: "A comprehensive textbook on optics, covering fundamental principles, advanced topics, and practical applications in modern optical technologies."
  parts:
    abstract: >
      This comprehensive textbook covers the fundamental principles of optics,
      from geometrical optics and wave phenomena to advanced topics including
      lasers, fiber optics, and optical instrumentation. Designed for
      undergraduate students in physics and electrical engineering, it provides
      a rigorous yet accessible treatment of topics including ray optics, 
      interference, diffraction, polarization, lasers, and fiber optics.
  keywords: [optics, physics, education, textbook, light, lenses, lasers, fiber optics, polarization, interference, diffraction]
  authors:
    - name:
        literal: QuadriviumPress
  license: CC-BY-SA-4.0
  short_title: Exploring Optics
  open_access: true
  github: QuadriviumPress/opticsTextbook
  bibliography: doc/references.bib
  # Remote hosts often answer 403, 404, or 5xx to the CI checker even when the
  # page is fine in a browser. Export downloads are build artifacts, produced
  # by the deploy pipeline and absent from a fresh CI clone.
  error_rules:
    - id: static-action-file-copied
      severity: ignore
    - rule: link-resolves
      severity: ignore
      keys:
        - "{http,https}://**"
        - exports/textbook.pdf
        - exports/chapters/chapter-01-basics.pdf
        - exports/chapters/chapter-01-basics.docx
        - exports/chapters/chapter-02-geometrical-optics.pdf
        - exports/chapters/chapter-02-geometrical-optics.docx
        - exports/chapters/chapter-03-optical-instrument.pdf
        - exports/chapters/chapter-03-optical-instrument.docx
        - exports/chapters/chapter-04-polarization.pdf
        - exports/chapters/chapter-04-polarization.docx
        - exports/chapters/chapter-05-wave.pdf
        - exports/chapters/chapter-05-wave.docx
        - exports/chapters/chapter-06-interference.pdf
        - exports/chapters/chapter-06-interference.docx
        - exports/chapters/chapter-07-diffraction.pdf
        - exports/chapters/chapter-07-diffraction.docx
        - exports/chapters/chapter-08-laser.pdf
        - exports/chapters/chapter-08-laser.docx
        - exports/chapters/chapter-09-advanced-instruments.pdf
        - exports/chapters/chapter-09-advanced-instruments.docx
        - exports/chapters/chapter-10-fiber-optics.pdf
        - exports/chapters/chapter-10-fiber-optics.docx
        - exports/chapters/chapter-11-ray-matrix.pdf
        - exports/chapters/chapter-11-ray-matrix.docx
    - rule: doi-link-valid
      severity: ignore
  numbering:
    headings: true
    math: true
    code: false
    figure: true
    table: true
    equation:
      template: Eq. (%s)
  math:
    '\dif': '\operatorname{d}\!'
    '\Vector': '\boldsymbol{#1}'
    '\Real': '\mathbb{R}'
    '\Complex': '\mathbb{C}'
  plugins:
    - plugins/simulation.mjs
  options:
    cache: true

    cache-expire: 30
  downloads:
   - id: pdf
     title: "Download PDF"
   # Note: Individual chapter DOCX files available via exports, but no combined textbook DOCX
   # - id: docx
   #   title: "Download DOCX"
  exclude:
    - _build/**
    - exports/**
    - content/exports**
  exports:
    # Full textbook PDF using Typst (faster than LaTeX)
    # NOTE: The id 'pdf' is referenced in the downloads section above to create download buttons
    # NOTE: Cross-reference warnings may appear for inter-chapter links due to case sensitivity
    - format: typst
      id: pdf
      output: exports/textbook.pdf
      author: QuadriviumPress
      subject: Optics Textbook
      keywords: [optics, physics, education]
      parts:
        abstract: >
          This comprehensive textbook covers the fundamental principles of optics,
          from geometrical optics and wave phenomena to advanced topics including
          lasers, fiber optics, and optical instrumentation. Designed for
          undergraduate students in physics and electrical engineering.
      articles:
        - content/Preface/Preface.md
        - content/Chap01Basics/Basics.md
        - content/Chap02GeometricalOptics/GeometricalOptics.md
        - content/Chap03OpticalInstruments/OpticalInstruments.md
        - content/Chap04Polarization/Polarization.md
        - content/Chap05Wave/Wave.md
        - content/Chap06InterferenceCoherence/InterferenceCoherence.md
        - content/Chap07Diffraction/Diffraction.md
        - content/Chap08Lasers/Lasers.md
        - content/Chap09AdvancedInstruments/AdvancedInstruments.md
        - content/Chap10FiberOptics/FiberOptics.md
        - content/Chap11RayMatrix/RayMatrix.md
    # Full textbook DOCX export
    # Note: DOCX format doesn't support combining multiple articles
    # Individual chapter DOCX files are available below
    # - format: docx
    #   id: docx
    #   output: exports/textbook.docx
    #   author: QuadriviumPress
    #   subject: Optics Textbook
    #   keywords: [optics, physics, education]
    #   articles:
    #     - content/Preface/Preface.md
    #     - content/Chap01Basics/Basics.md
    #     - content/Chap02GeometricalOptics/GeometricalOptics.md
    #     - content/Chap03OpticalInstruments/OpticalInstruments.md
    #     - content/Chap04Polarization/Polarization.md
    #     - content/Chap05Wave/Wave.md
    #     - content/Chap06InterferenceCoherence/InterferenceCoherence.md
    #     - content/Chap07Diffraction/Diffraction.md
    #     - content/Chap08Lasers/Lasers.md
    #     - content/Chap09AdvancedInstruments/AdvancedInstruments.md
    #     - content/Chap10FiberOptics/FiberOptics.md
    #     - content/Chap11RayMatrix/RayMatrix.md
    # Individual chapter PDFs (using Typst for faster builds)
    - format: typst
      id: chapter-01-pdf
      output: exports/chapters/chapter-01-basics.pdf
      article: content/Chap01Basics/Basics.md
    - format: typst
      id: chapter-02-pdf
      output: exports/chapters/chapter-02-geometrical-optics.pdf
      article: content/Chap02GeometricalOptics/GeometricalOptics.md
    - format: typst
      id: chapter-03-pdf
      output: exports/chapters/chapter-03-optical-instrument.pdf
      article: content/Chap03OpticalInstruments/OpticalInstruments.md
    - format: typst
      id: chapter-04-pdf
      output: exports/chapters/chapter-04-polarization.pdf
      article: content/Chap04Polarization/Polarization.md
    - format: typst
      id: chapter-05-pdf
      output: exports/chapters/chapter-05-wave.pdf
      article: content/Chap05Wave/Wave.md
    - format: typst
      id: chapter-06-pdf
      output: exports/chapters/chapter-06-interference.pdf
      article: content/Chap06InterferenceCoherence/InterferenceCoherence.md
    - format: typst
      id: chapter-07-pdf
      output: exports/chapters/chapter-07-diffraction.pdf
      article: content/Chap07Diffraction/Diffraction.md
    - format: typst
      id: chapter-08-pdf
      output: exports/chapters/chapter-08-laser.pdf
      article: content/Chap08Lasers/Lasers.md
    - format: typst
      id: chapter-09-pdf
      output: exports/chapters/chapter-09-advanced-instruments.pdf
      article: content/Chap09AdvancedInstruments/AdvancedInstruments.md
    - format: typst
      id: chapter-10-pdf
      output: exports/chapters/chapter-10-fiber-optics.pdf
      article: content/Chap10FiberOptics/FiberOptics.md
    - format: typst
      id: chapter-11-pdf
      output: exports/chapters/chapter-11-ray-matrix.pdf
      article: content/Chap11RayMatrix/RayMatrix.md
    # Individual chapter DOCX files
    - format: docx
      id: chapter-01-docx
      output: exports/chapters/chapter-01-basics.docx
      article: content/Chap01Basics/Basics.md
    - format: docx
      id: chapter-02-docx
      output: exports/chapters/chapter-02-geometrical-optics.docx
      article: content/Chap02GeometricalOptics/GeometricalOptics.md
    - format: docx
      id: chapter-03-docx
      output: exports/chapters/chapter-03-optical-instrument.docx
      article: content/Chap03OpticalInstruments/OpticalInstruments.md
    - format: docx
      id: chapter-04-docx
      output: exports/chapters/chapter-04-polarization.docx
      article: content/Chap04Polarization/Polarization.md
    - format: docx
      id: chapter-05-docx
      output: exports/chapters/chapter-05-wave.docx
      article: content/Chap05Wave/Wave.md
    - format: docx
      id: chapter-06-docx
      output: exports/chapters/chapter-06-interference.docx
      article: content/Chap06InterferenceCoherence/InterferenceCoherence.md
    - format: docx
      id: chapter-07-docx
      output: exports/chapters/chapter-07-diffraction.docx
      article: content/Chap07Diffraction/Diffraction.md
    - format: docx
      id: chapter-08-docx
      output: exports/chapters/chapter-08-laser.docx
      article: content/Chap08Lasers/Lasers.md
    - format: docx
      id: chapter-09-docx
      output: exports/chapters/chapter-09-advanced-instruments.docx
      article: content/Chap09AdvancedInstruments/AdvancedInstruments.md
    - format: docx
      id: chapter-10-docx
      output: exports/chapters/chapter-10-fiber-optics.docx
      article: content/Chap10FiberOptics/FiberOptics.md
    - format: docx
      id: chapter-11-docx
      output: exports/chapters/chapter-11-ray-matrix.docx
      article: content/Chap11RayMatrix/RayMatrix.md
  toc:
    - title: Preface
      file: content/Preface/Preface.md
    - title: Chapters
      children:
        - title: Chapter 1 - Basics
          file: content/Chap01Basics/Basics.md
          children:
            - title: Problems
              file: content/Chap01Basics/Problems/BasicsExercise.md
        - title: Chapter 2 - Geometrical Optics
          file: content/Chap02GeometricalOptics/GeometricalOptics.md
          children:
            - title: Problems
              file: content/Chap02GeometricalOptics/Problems/GeometricalOpticsExercise.md
        - title: Chapter 3 - Optical Instruments
          file: content/Chap03OpticalInstruments/OpticalInstruments.md
          children:
            - title: Problems
              file: content/Chap03OpticalInstruments/Problems/OpticalInstrumentsExercise.md
        - title: Chapter 4 - Polarization
          file: content/Chap04Polarization/Polarization.md
          children:
            - title: Problems
              file: content/Chap04Polarization/Problems/PolarizationExercise.md
        - title: Chapter 5 - Waves
          file: content/Chap05Wave/Wave.md
          children:
            - title: Problems
              file: content/Chap05Wave/Problems/WaveExercise.md
        - title: Chapter 6 - Interference and Coherence
          file: content/Chap06InterferenceCoherence/InterferenceCoherence.md
          children:
            - title: Problems
              file: content/Chap06InterferenceCoherence/Problems/InterferenceCoherenceExercise.md
        - title: Chapter 7 - Diffraction
          file: content/Chap07Diffraction/Diffraction.md
          children:
            - title: Problems
              file: content/Chap07Diffraction/Problems/DiffractionExercise.md
        - title: Chapter 8 - Lasers
          file: content/Chap08Lasers/Lasers.md
          children:
            - title: Problems
              file: content/Chap08Lasers/Problems/LasersExercise.md
        - title: Chapter 9 - Advanced Instruments
          file: content/Chap09AdvancedInstruments/AdvancedInstruments.md
          children:
            - title: Problems
              file: content/Chap09AdvancedInstruments/Problems/AdvancedInstrumentsExercise.md
        - title: Chapter 10 - Fiber Optics
          file: content/Chap10FiberOptics/FiberOptics.md
          children:
            - title: Problems
              file: content/Chap10FiberOptics/Problems/FiberOpticsExercise.md
        - title: Chapter 11 - Ray Matrices
          file: content/Chap11RayMatrix/RayMatrix.md
          children:
            - title: Problems
              file: content/Chap11RayMatrix/Problems/RayMatrixExercise.md
    - title: Appendices
      children:
        - title: Appendix A - Complex Numbers in Optics
          file: content/Appendices/ComplexNumbers.md
        - title: Appendix B - Matrix Multiplication in Optics
          file: content/Appendices/MatrixMultiplication.md
        - title: Appendix C - Fourier Transform in Optics
          file: content/Appendices/FourierTransform.md
        - title: Appendix D - Vector Calculus for Electromagnetic Fields
          file: content/Appendices/VectorCalculus.md
        - title: Mathematical Notation Index
          file: content/Appendices/MathematicalNotation.md
        - title: Glossary of Optical Terms
          file: content/Appendices/Glossary.md
        - title: Index of Key Concepts
          file: content/Appendices/Index.md
    - title: Downloads
      file: content/Downloads.md
    - title: Author
      file: content/Author/author.md
site:
  template: book-theme
  title: "Exploring Optics: From Fundamentals to Advanced Applications"
  options:
    logo_dark: img/advanced_optics_logo_dark.svg
    logo_text: Optics Textbook
    logo_alt: Exploring Optics logo
    logo: img/advanced_optics_logo_white.svg
    favicon: img/favicon.ico
    # Simulation print/aspect rules are inlined at the top of custom.css
    # (keep in sync with plugins/simulation.css); MyST ships only one style file.
    style: css/custom.css
    analytics:
      google: G-BT4TZCELT2
    hide_myst_branding: true
    repository:
      url: https://github.com/QuadriviumPress/opticsTextbook/
      branch: main
    use_edit_page_button: true
    use_repository_button: true
    use_issues_button: true
    search:
      minimum_characters: 2
      max_results: 20
      index_all: true
  nav:
    - title: "Contribute"
      children:
        - title: "Report Issue"
          url: https://github.com/QuadriviumPress/opticsTextbook/issues/new?labels=correction
        - title: "Join Project"
          url: https://github.com/QuadriviumPress/opticsTextbook/blob/main/README.md
    - title: "Sources & Attribution"
      url: https://github.com/QuadriviumPress/opticsTextbook/blob/main/SOURCES.md
